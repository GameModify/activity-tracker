name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - if: runner.os == 'Windows'
        run: npm run prepare:installer
      - if: runner.os == 'Windows'
        run: npm run package:windows
      - if: runner.os == 'Windows'
        run: node scripts/desktop/smoke.ts
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: activity-tracker-windows
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
            dist/windows/SHA256SUMS.txt
